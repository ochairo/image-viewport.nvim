name: Plugin checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build pinned development image
        run: docker build --file Containerfile --tag plugin-checks .
      - name: Run complete portable checks offline
        run: >-
          docker run --rm --pull=never --network=none --read-only
          --cap-drop=ALL --security-opt=no-new-privileges
          --pids-limit=512 --memory=4g --cpus=4
          --user "$(id -u):$(id -g)"
          --tmpfs /tmp:rw,nosuid,nodev,size=1g,mode=1777
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          plugin-checks make check
